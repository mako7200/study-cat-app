<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0820">
<title>スタディにゃんこ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スタディにゃんこ">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn" id="btn-menu" aria-label="メニュー">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <div class="coin-pill"><span class="coin"></span><span class="coin-count">0</span></div>
  </header>

  <main class="timer-view" id="timer-view">
    <div class="cat-ring">
      <svg class="ring" id="ring" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="gauge-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" id="gauge-gradient-from" />
            <stop offset="1" id="gauge-gradient-to" />
          </linearGradient>
          <g id="paw-shape">
            <path d="M6.3 17.4C6.3 14 8.9 11.8 12 11.8S17.7 14 17.7 17.4c0 2.5-2 3.6-3.5 2.8-1-.5-1.6-.7-2.2-.7s-1.2.2-2.2.7c-1.5.8-3.5-.3-3.5-2.8z" />
            <ellipse cx="5.2" cy="10.4" rx="2.4" ry="2.9" transform="rotate(-25 5.2 10.4)" />
            <ellipse cx="9.3" cy="6.6" rx="2.5" ry="3.1" transform="rotate(-8 9.3 6.6)" />
            <ellipse cx="14.7" cy="6.6" rx="2.5" ry="3.1" transform="rotate(8 14.7 6.6)" />
            <ellipse cx="18.8" cy="10.4" rx="2.4" ry="2.9" transform="rotate(25 18.8 10.4)" />
          </g>
          <filter id="glow-filter" filterUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="160">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="neon-filter" filterUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="160">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="near" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="far" />
            <feMerge><feMergeNode in="far" /><feMergeNode in="far" /><feMergeNode in="near" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <circle class="ring-track" cx="60" cy="60" r="54" />
        <g class="ring-bar">
          <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="54" />
          <circle class="ring-core" id="ring-core" cx="60" cy="60" r="54" />
        </g>
        <circle class="ring-knob" id="ring-knob" r="6" />
        <g class="ring-paw" id="ring-paw">
          <g class="paw-edge"><use href="#paw-shape" /></g>
          <g class="paw-foot"><use href="#paw-shape" /></g>
          <g class="paw-bean"><use href="#paw-shape" /></g>
        </g>
      </svg>
      <img class="cat-img" id="cat-img" src="images/cat-sleep.jpg" alt="">
    </div>
    <button type="button" class="tag-chip" id="btn-tag">
      <span class="tag-dot" id="tag-dot"></span>
      <span id="tag-name"></span>
    </button>
    <button type="button" class="timer-display" id="timer-display">25:00</button>
    <button type="button" class="btn-primary btn-start" id="btn-start">はじめる</button>
  </main>

  <div class="drawer-overlay" id="drawer">
    <nav class="drawer">
      <div class="drawer-coins">
        <span class="drawer-coins-label">コイン</span>
        <span class="drawer-coins-value"><span class="coin"></span><span class="coin-count">0</span></span>
      </div>
      <button type="button" class="menu-item" data-page="page-log">
        <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" /><circle cx="4" cy="6" r="0.6" /><circle cx="4" cy="12" r="0.6" /><circle cx="4" cy="18" r="0.6" /></svg>
        <span>記録</span>
      </button>
      <button type="button" class="menu-item" data-page="page-tags">
        <svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z" /><circle cx="7.5" cy="8.5" r="1.2" /></svg>
        <span>タグ</span>
      </button>
      <button type="button" class="menu-item" data-page="page-store">
        <svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9h16M4 9v11h16V9M9 20v-6h6v6" /></svg>
        <span>ストア</span>
      </button>
      <button type="button" class="menu-item" data-page="page-settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <section class="page" id="page-log">
    <div class="page-head">
      <button type="button" class="icon-btn page-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      <span class="page-title">記録</span>
      <span class="page-head-side"></span>
    </div>
    <div class="page-body">
      <div class="log-list" id="log-list"></div>
    </div>
  </section>

  <section class="page" id="page-tags">
    <div class="page-head">
      <button type="button" class="icon-btn page-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      <span class="page-title">タグ</span>
      <span class="page-head-side"></span>
    </div>
    <div class="page-body">
      <div class="tag-list" id="tag-list"></div>
      <button type="button" class="btn-outline" id="btn-add-tag">タグを追加</button>
    </div>
  </section>

  <section class="page" id="page-store">
    <div class="page-head">
      <button type="button" class="icon-btn page-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      <span class="page-title">ストア</span>
      <div class="coin-pill"><span class="coin"></span><span class="coin-count">0</span></div>
    </div>
    <div class="store-seg" id="store-seg">
      <button type="button" class="store-seg-btn selected" data-category="cat">猫</button>
      <button type="button" class="store-seg-btn" data-category="gauge">ゲージ</button>
      <button type="button" class="store-seg-btn" data-category="theme">壁紙</button>
      <button type="button" class="store-seg-btn" data-category="time">時間</button>
    </div>
    <div class="page-body">
      <div class="store-sections" id="store-grid"></div>
    </div>
  </section>

  <section class="page" id="page-settings">
    <div class="page-head">
      <button type="button" class="icon-btn page-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      <span class="page-title">設定</span>
      <span class="page-head-side"></span>
    </div>
    <div class="page-body">
      <div class="accordion">
        <button type="button" class="accordion-head" aria-expanded="false">
          <span>開発者設定</span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <div class="accordion-body" hidden>
          <div id="dev-locked" class="dev-box">
            <div class="dev-field">
              <input type="password" class="text-input" id="dev-code" placeholder="コード" autocomplete="off">
              <button type="button" class="btn-primary" id="dev-unlock">解除</button>
            </div>
            <div class="dev-error" id="dev-error" hidden>コードが違います</div>
          </div>
          <div id="dev-unlocked" class="dev-box" hidden>
            <div class="dev-status">
              <span>管理者モード ON</span>
              <button type="button" class="dev-off" id="dev-off">OFFにする</button>
            </div>
            <div class="dev-note">ONの間はストアの商品がすべて使えます。OFFにすると、未購入の商品は元に戻ります。</div>
          </div>
        </div>
      </div>
      <div class="accordion">
        <button type="button" class="accordion-head" aria-expanded="false">
          <span>アプリ情報</span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <div class="accordion-body" hidden>
          <div class="app-info-row">
            <span class="app-version">Version 0.6.1</span>
            <button type="button" class="btn-small" id="btn-fetch-latest">最新版を取得</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="sheet-overlay" id="setup-sheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="section-title">時間</div>
      <div class="minute-row" id="minute-row"></div>
      <div class="section-title">タグ</div>
      <div class="sheet-tags" id="sheet-tags"></div>
      <button type="button" class="btn-primary" id="setup-sheet-close">決定</button>
    </div>
  </div>

  <div class="modal-overlay" id="tag-modal">
    <div class="modal-card">
      <div class="modal-message" id="tag-modal-title">タグを追加</div>
      <input type="text" class="text-input" id="tag-modal-name" placeholder="タグ名" maxlength="20">
      <div class="color-row" id="tag-modal-colors"></div>
      <button type="button" class="link-danger" id="tag-modal-delete">このタグを削除</button>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="tag-modal-cancel">キャンセル</button>
        <button type="button" class="modal-btn modal-btn-primary" id="tag-modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="done-modal">
    <div class="modal-card">
      <img class="done-cat" id="done-cat" src="images/cat-sit.jpg" alt="">
      <div class="done-minutes" id="done-minutes"></div>
      <div class="done-coins"><span class="coin"></span><span id="done-coins"></span></div>
      <div class="done-sub" id="done-sub"></div>
      <div class="understanding-select" id="understanding-select">
        <button type="button" class="understanding-btn" data-level="1">もう少し</button>
        <button type="button" class="understanding-btn" data-level="2">まあまあ</button>
        <button type="button" class="understanding-btn" data-level="3">バッチリ</button>
      </div>
      <textarea class="text-input" id="done-memo" placeholder="メモ（任意）" rows="2"></textarea>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="done-skip">スキップ</button>
        <button type="button" class="modal-btn modal-btn-primary" id="done-save">保存</button>
      </div>
    </div>
  </div>

  <div class="update-banner" id="update-banner">
    <span>新しいバージョンがあります</span>
    <button type="button" class="btn-small" id="update-btn">更新</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-card">
      <div class="modal-message" id="confirm-modal-message"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="confirm-modal-cancel">キャンセル</button>
        <button type="button" class="modal-btn" id="confirm-modal-ok"></button>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
